name: Build Eden MySims

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Get this repo (contains the patch)
        uses: actions/checkout@v4

      - name: Install build tools Eden needs
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools autoconf automake libtool nasm pkg-config

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Get Eden v0.2.1 source
        run: git clone --depth 1 --branch v0.2.1 https://git.eden-emu.dev/eden-emu/eden.git eden

      - name: Apply MySims fix
        run: |
          cd eden
          git apply ../eden-mysims-fix.patch
          git diff --stat

      - name: Build APK
        run: |
          cd eden
          set -o pipefail
          TARGET=standard TYPE=Release sh .ci/android/build.sh 2>&1 | tee ../build-log.txt

      - name: Show errors (only if the build failed)
        if: failure()
        run: grep -n -B2 -A12 -E "CMake Error|error:|FAILED:" build-log.txt | head -150 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-mysims-apk
          path: eden/artifacts/*.apk
